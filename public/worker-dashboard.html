<head>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<script src="/js/auth.js"></script>
<script src="/js/navbar.js"></script>
<script>
protectPage(["worker"]);
</script>

<div class="container">
    <h1>Worker Dashboard</h1>
    
    <div style="margin-bottom: 2rem; padding: 1rem; border: 1px solid #ccc; border-radius: 5px;">
        <h3>Worker Settings</h3>
        <p>Your current capacity threshold is: <strong id="current-threshold">Loading...</strong></p>
        <label>Update Threshold:
            <input type="number" id="new-threshold" min="1" style="width: 80px;" />
        </label>
        <button type="button" onclick="updateWorkThreshold()">Save</button>
    </div>

    <h2>My assigned jobs</h2>
    <table border="1" width="100%">
        <thead>
            <tr>
                <th>Job ID</th>
                <th>Client</th>
                <th>Design</th>
                <th>Job target</th>
                <th>Your target</th>
                <th>Worker slot</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="worker-jobs-table"></tbody>
    </table>

    <p style="margin-top:1rem">
        <button type="button" onclick="location.href='production-entry.html'">Enter Production</button>
    </p>
</div>

<script src="/js/api.js"></script>
<script src="/js/worker-dashboard.js"></script>

</body>
