<style>
.input-box {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

input {
    padding: 8px;
    flex: 1;
}

button {
    padding: 8px 12px;
}
</style>
</head>

<body>

<script src="/js/navbar.js"></script>
