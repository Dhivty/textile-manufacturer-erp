<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/css/style.css">

<style>
.form-card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
}

.form-card input {
    padding: 8px;
    flex: 1;
}

.form-card button {
    padding: 8px 12px;
}
</style>

</head>

<body>

<script src="/js/auth.js"></script>
<script src="/js/navbar.js"></script>

<script>
protectPage(["manufacturer"]);
</script>

<div class="container">

<h2>Inventory</h2>

<!-- 🔥 ADD MATERIAL FORM -->
<div class="form-card">
    <input id="name" placeholder="Material Name">
    <input id="qty" type="number" placeholder="Quantity">
    <input id="threshold" type="number" placeholder="Threshold">
    <button onclick="addMaterial()">Add</button>
</div>

<!-- TABLE -->
<table class="styled-table">
<thead>
<tr>
<th>S.No</th>
<th>Material</th>
<th>Available</th>
<th>Threshold</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="inventory-table"></tbody>

</table>

</div>

<script src="/js/api.js"></script>
<script src="/js/inventory.js"></script>

</body>
</html>
