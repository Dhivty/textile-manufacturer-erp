services:
  - type: web
    name: erp-system
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        value: 'your_db_host'
      - key: DB_USER
        value: 'your_db_user'
      - key: DB_PASSWORD
        value: 'your_db_password'
      - key: DB_NAME
        value: 'textile_erp'
